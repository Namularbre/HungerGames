name: HungerGames
version: '${project.version}'
main: org.namumaterial.hungergames.HungerGames
api-version: '1.18'
commands:
  kits:
    description: Show all the existing kits
    usage: /kits
  kit:
    description: Select your kit in the lobby, or show your current kit
    usage: /kit [name]
  setstate:
    description: Force the game state (debug)
    usage: /setstate <not_started|starting|playing|ended>
  state:
    description: Show the game state (debug)
    usage: /state
  gift:
    description: Send yourself a sponsor gift (debug)
    usage: /gift
  feast:
    description: Spawn a feast in the arena (debug)
    usage: /feast
  setpopularity:
    description: Set your own popularity (debug)
    usage: /setpopularity <amount>
  popularity:
    description: Show your popularity, or the one of another tribute (debug)
    usage: /popularity [player]
  heal:
    description: Heal yourself (debug)
    usage: /heal
  spawn:
    description: Teleport to the middle of the arena (debug)
    usage: /spawn
  arenaradius:
    description: Show the arena radius, or set it (debug)
    usage: /arenaradius [radius]
  kitselector:
    description: Give yourself a kit selector (debug)
    usage: /kitselector
